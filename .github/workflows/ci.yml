name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Verify lock file
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Ruff
        run: uv run --locked ruff check .
      - name: Format check
        run: uv run --locked ruff format --check .
      - name: Pyright
        run: uv run --locked pyright
      - name: Tests
        run: uv run --locked pytest --cov --cov-report=term-missing
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          WNACG_DATA_DIR: ${{ runner.temp }}\wnacg-smoke
        run: uv run --locked python -m wnacg --smoke-test

  build-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked build dependencies
        run: uv sync --locked --no-dev --group build
      - name: Build executable
        run: .\build.bat
      - name: Smoke test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\WNACG-Downloader.exe' -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

  dependency-security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Audit locked runtime dependencies
        run: uv audit --locked --no-dev
      - name: Validate CycloneDX SBOM export
        shell: pwsh
        run: uv export --locked --no-dev --format cyclonedx1.5 --output-file "$env:RUNNER_TEMP\wnacg-sbom.cdx.json"
