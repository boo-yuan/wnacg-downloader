name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pyinstaller
        
    - name: Build with PyInstaller
      run: |
        python -c "from PIL import Image; Image.open('src/resource/icon.png').save('src/resource/icon.ico', format='ICO', sizes=[(256, 256)])"
        pyinstaller --noconfirm --onefile --windowed --icon "src/resource/icon.ico" --name "WNACG-Downloader" --paths src src/main.py
        
    - name: Archive Release
      uses: actions/upload-artifact@v4
      with:
        name: WNACG-Downloader-Windows
        path: dist/WNACG-Downloader.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/WNACG-Downloader.exe
        generate_release_notes: true
