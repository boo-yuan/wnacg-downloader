[project]
name = "wnacg-downloader"
version = "0.1.0"
description = "A modern comic download manager"
authors = [
    { name = "boo-yuan" }
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "PySide6-Fluent-Widgets>=1.6.4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "beautifulsoup4>=4.15.0",
    "loguru>=0.7.3",
    "curl-cffi>=0.15.0",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
