[project]
name = "wnacg-downloader"
version = "1.3.0"
description = "A modern comic download manager"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "boo-yuan" }
]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "PySide6>=6.6.0",
    "PySide6-Fluent-Widgets>=1.6.4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "beautifulsoup4>=4.15.0",
    "loguru>=0.7.3",
    "curl-cffi>=0.15.0",
    "pillow>=12.3.0",
    "packaging>=25.0",
]

[project.gui-scripts]
wnacg-downloader = "wnacg.main:main"

[project.urls]
Homepage = "https://github.com/boo-yuan/wnacg-downloader"
Issues = "https://github.com/boo-yuan/wnacg-downloader/issues"
Repository = "https://github.com/boo-yuan/wnacg-downloader"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wnacg"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "ASYNC", "C4", "DTZ", "PTH", "RUF", "S"]
ignore = ["ASYNC240", "RUF001", "RUF002", "RUF003", "S101", "S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pyright>=1.1.403",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUntypedBaseClass = false
reportPrivateUsage = false

[tool.coverage.run]
branch = true
source = ["wnacg"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 55
